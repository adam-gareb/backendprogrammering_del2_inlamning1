<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book List</title>

    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
        }

        div{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto;
        }

        h1{
            text-align: center;
        }

    </style>
</head>

<body>
    
    <div>
        <h1>Book list:</h1>

        <ul>
            <li th:each="book : ${books}">
                <b><span th:text="${book.title}"></span></b> by
                <b><span th:text="${book.author}"></span></b>
                (<span th:text="${book.genre}"></span>)
            </li>
        </ul>

        <a th:href="@{/home}">&lt;&lt; Go back</a>
    </div>
</body>

</html>
